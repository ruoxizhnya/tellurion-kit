name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 包边界核对 + 版本纪律核对 + 测试。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是「版本纪律核对」那条腿的前提：默认只取 HEAD，
      # git tag 会恒为空，tag ↔ CHANGELOG ↔ 矩阵的对拍就变成假绿。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: 包边界核对（KT-01 护栏：业务词 / 越界 import / SCOPE.md 未登记包 即红）
        run: go run ./tools/check_scope

      - name: 版本纪律核对（KT-02 护栏：矩阵 ↔ CHANGELOG ↔ tag 不一致即红）
        run: go run ./tools/check_release_matrix

      - name: Test
        run: go test ./... -count=1

      # KT-12：并发面的机械判据。`-count=1` 只证明「逻辑对」，证明不了「并发安全」——
      # httpserver / auth / db / observability 这些包的共享状态一旦被无锁读写，
      # 上面那步是绿的。覆盖面 = **全仓**（不缩小到三包），理由见 docs/TASKS.md KT-12 ③：
      # 缩小覆盖面会让读者以为其余包已过竞态检测，那是假账。
      # 本机 Windows 无 gcc ⇒ 这一步只能在 Linux runner 上取证（CGO_ENABLED=1 是 -race 的前提）。
      - name: Test -race（覆盖面：全仓所有包）
        run: go test ./... -race -count=1
